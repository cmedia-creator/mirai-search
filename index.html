<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>PSX ESCAPE</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:monospace}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}#hud{position:fixed;inset:0;pointer-events:none;color:#eee;text-shadow:1px 1px #000}#goal{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;font-size:12px}#stick{position:absolute;left:18px;bottom:max(22px,env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #ddd7;border-radius:50%;background:#0005}#nub{position:absolute;left:36px;top:36px;width:38px;height:38px;border-radius:50%;background:#ddd8}#run{pointer-events:auto;position:absolute;right:20px;bottom:max(42px,env(safe-area-inset-bottom));width:80px;height:56px;border:2px solid #ddd8;background:#111b;display:grid;place-items:center;font-weight:bold}#start,#over{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;background:#080808;color:#ddd;padding:24px}#over{display:none}.title{font-size:30px;font-weight:900;letter-spacing:.16em}.sub{font-size:12px;line-height:1.8;color:#aaa}button{font:inherit;font-size:16px;padding:14px 34px;color:#eee;background:#111;border:1px solid #aaa}#danger{position:fixed;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 0 rgba(120,0,0,0);transition:box-shadow .08s}#alert{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);z-index:7;color:#a33;font:bold 18px monospace;letter-spacing:.18em;text-shadow:2px 2px #000;opacity:0;pointer-events:none}#alert.on{animation:flash .55s steps(2,end) 2}@keyframes flash{50%{opacity:1}}</style></head><body><canvas id="c"></canvas><div id="danger"></div><div id="alert">見つかった</div><div id="hud"><div id="goal">EXITまで逃げろ</div><div id="stick"><div id="nub"></div></div><div id="run">RUN</div></div><div id="start"><div><div class="title">ESCAPE</div><p class="sub">左ドラッグ：移動<br>右ドラッグ：視点<br>RUN：走る</p><button id="play">START</button></div></div><div id="over"><div><div class="title" id="res"></div><p class="sub" id="rest"></p><button id="retry">RETRY</button></div></div><script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false}),vw=0,vh=0,RW=240,RH=135,off=document.createElement('canvas'),g=off.getContext('2d',{alpha:false});off.width=RW;off.height=RH;
var map=[
"111111111111111111111",
"100000000000000000001",
"101111011111011111101",
"100001000001000000001",
"101101011101011101101",
"100100010000010001001",
"100101110111110101001",
"100100000100000101001",
"101111010101111101001",
"100000010100000001001",
"101111110111110111101",
"100000000000010000001",
"101101111110010111101",
"100100000010010000001",
"100101110010111101101",
"100100000000000001001",
"101111011111011101001",
"100000000000000000001",
"111111111111111111111"],MW=21,MH=19;
var p={x:1.5,y:1.5},enemy={x:10.5,y:3.5},ang=0,mv={x:0,y:0},running=false,sprint=false,last=performance.now(),chasing=false,seenTimer=0,stepTimer=0,audio=null,patrol=0,patrolPts=[{x:10.5,y:3.5},{x:14.5,y:3.5},{x:14.5,y:5.5},{x:10.5,y:5.5},{x:6.5,y:5.5},{x:6.5,y:3.5}];
function resize(){vw=innerWidth;vh=innerHeight;var d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(vw*d);cv.height=Math.round(vh*d);ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false}resize();addEventListener('resize',resize);
function wall(x,y){var X=Math.floor(x),Y=Math.floor(y);return X<0||Y<0||X>=MW||Y>=MH||map[Y][X]==='1'}function free(x,y){var r=.16;return !wall(x-r,y-r)&&!wall(x+r,y-r)&&!wall(x-r,y+r)&&!wall(x+r,y+r)}
function cast(a){var dx=Math.cos(a),dy=Math.sin(a),d=0;while(d<14){d+=.045;if(wall(p.x+dx*d,p.y+dy*d))return d}return 14}
function los(){var dx=p.x-enemy.x,dy=p.y-enemy.y,d=Math.hypot(dx,dy),n=Math.ceil(d/.1);for(var i=1;i<n;i++)if(wall(enemy.x+dx*i/n,enemy.y+dy*i/n))return false;return true}
function beep(freq,dur,vol){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();var o=audio.createOscillator(),gn=audio.createGain();o.type='square';o.frequency.value=freq;gn.gain.setValueAtTime(vol,audio.currentTime);gn.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(gn);gn.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(_){}}
function reset(){p.x=1.5;p.y=1.5;enemy.x=10.5;enemy.y=3.5;ang=0;chasing=false;seenTimer=0;stepTimer=0;patrol=0;running=true;last=performance.now();document.getElementById('danger').style.boxShadow='inset 0 0 0 rgba(120,0,0,0)';document.getElementById('over').style.display='none'}
function end(win){running=false;document.getElementById('res').textContent=win?'ESCAPED':'CAUGHT';document.getElementById('rest').textContent=win?'外へ出た。':'捕まった。';document.getElementById('over').style.display='flex'}
function update(dt){if(!running)return;var len=Math.hypot(mv.x,mv.y);var mx=len?mv.x/Math.max(1,len):0,my=len?mv.y/Math.max(1,len):0,sp=(sprint?2.55:1.5)*dt;var nx=p.x+(Math.cos(ang)*(-my)+Math.cos(ang+Math.PI/2)*mx)*sp,ny=p.y+(Math.sin(ang)*(-my)+Math.sin(ang+Math.PI/2)*mx)*sp;if(free(nx,p.y))p.x=nx;if(free(p.x,ny))p.y=ny;var dx=p.x-enemy.x,dy=p.y-enemy.y,d=Math.hypot(dx,dy),visible=(d<8.2&&los())||d<2.3;if(visible){seenTimer+=dt;if(!chasing&&seenTimer>.14){chasing=true;var al=document.getElementById('alert');al.classList.remove('on');void al.offsetWidth;al.classList.add('on');beep(72,.22,.06)}}else seenTimer=Math.max(0,seenTimer-dt*2);var tx=p.x,ty=p.y,enemySpeed;if(chasing){enemySpeed=d<2.2?2.05:1.72}else{var pp=patrolPts[patrol],pd=Math.hypot(pp.x-enemy.x,pp.y-enemy.y);if(pd<.45){patrol=(patrol+1)%patrolPts.length;pp=patrolPts[patrol]}tx=pp.x;ty=pp.y;enemySpeed=.82}var edx=tx-enemy.x,edy=ty-enemy.y,ed=Math.hypot(edx,edy),es=enemySpeed*dt;if(ed>0){var ex=enemy.x+edx/ed*es,ey=enemy.y+edy/ed*es;if(free(ex,enemy.y))enemy.x=ex;if(free(enemy.x,ey))enemy.y=ey}if(chasing){stepTimer-=dt;var interval=Math.max(.16,Math.min(.58,d*.075));if(stepTimer<=0){beep(d<2?54:46,.055,Math.max(.012,.055-d*.006));stepTimer=interval}}var danger=Math.max(0,Math.min(.72,(4-d)/4*.72));document.getElementById('danger').style.boxShadow='inset 0 0 '+Math.round(30+danger*120)+'px rgba(110,0,0,'+danger+')';if(d<.42)end(false);if(p.x>18.7&&p.y>16.8)end(true)}
function draw(){g.fillStyle='#697079';g.fillRect(0,0,RW,RH/2);g.fillStyle='#383532';g.fillRect(0,RH/2,RW,RH/2);var fov=1.05;for(var col=0;col<RW;col+=2){var ra=ang-fov/2+fov*col/RW,d=cast(ra)*Math.cos(ra-ang),hh=Math.min(RH*1.8,RH/(d*.55)),v=Math.max(45,Math.floor(185-d*16));g.fillStyle='rgb('+v+','+Math.max(35,v-10)+','+Math.max(30,v-16)+')';g.fillRect(col,(RH-hh)/2,2,hh)}
var ea=Math.atan2(enemy.y-p.y,enemy.x-p.x),rel=Math.atan2(Math.sin(ea-ang),Math.cos(ea-ang)),ed=Math.hypot(enemy.x-p.x,enemy.y-p.y);if(Math.abs(rel)<fov/2&&ed<cast(ea)+.15){var sx=RW/2+rel/(fov/2)*RW/2,sz=Math.min(90,58/Math.max(.5,ed));g.fillStyle='#080808';g.fillRect(sx-sz*.13,RH/2-sz*.4,sz*.26,sz*.8);g.fillStyle='#d7d2bc';g.fillRect(sx-sz*.06,RH/2-sz*.25,2,1);g.fillRect(sx+sz*.035,RH/2-sz*.25,2,1)}
var xa=Math.atan2(17.5-p.y,19.5-p.x),xr=Math.atan2(Math.sin(xa-ang),Math.cos(xa-ang)),xd=Math.hypot(19.5-p.x,17.5-p.y);if(Math.abs(xr)<fov/2&&xd<cast(xa)+.2){var xx=RW/2+xr/(fov/2)*RW/2;g.fillStyle='#3f7647';g.fillRect(xx-6,RH/2-18,12,36);g.fillStyle='#ddd';g.font='5px monospace';g.fillText('EXIT',xx-6,RH/2-11)}
g.fillStyle='#eee';g.fillRect(RW/2-2,RH/2,5,1);g.fillRect(RW/2,RH/2-2,1,5);ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh);var dd=Math.hypot(enemy.x-p.x,enemy.y-p.y),shake=chasing&&dd<2.7?Math.max(0,(2.7-dd)*1.4):0,sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;ctx.drawImage(off,0,0,RW,RH,sx,sy,vw,vh)}
function loop(t){var dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
var lid=null,rid=null,ls=null,rs=null,nub=document.getElementById('nub');cv.addEventListener('touchstart',function(ev){ev.preventDefault();for(var i=0;i<ev.changedTouches.length;i++){var t=ev.changedTouches[i];if(t.clientX<vw*.5&&lid===null){lid=t.identifier;ls={x:t.clientX,y:t.clientY}}else if(rid===null){rid=t.identifier;rs={x:t.clientX,y:t.clientY}}}},{passive:false});cv.addEventListener('touchmove',function(ev){ev.preventDefault();for(var i=0;i<ev.changedTouches.length;i++){var t=ev.changedTouches[i];if(t.identifier===lid){var dx=t.clientX-ls.x,dy=t.clientY-ls.y,m=Math.hypot(dx,dy),lim=38;if(m>lim){dx*=lim/m;dy*=lim/m}mv.x=dx/lim;mv.y=dy/lim;nub.style.transform='translate('+dx+'px,'+dy+'px)'}else if(t.identifier===rid){ang+=(t.clientX-rs.x)*.007;rs.x=t.clientX;rs.y=t.clientY}}},{passive:false});function te(ev){for(var i=0;i<ev.changedTouches.length;i++){var t=ev.changedTouches[i];if(t.identifier===lid){lid=null;mv.x=0;mv.y=0;nub.style.transform='none'}if(t.identifier===rid)rid=null}}cv.addEventListener('touchend',te);cv.addEventListener('touchcancel',te);var rb=document.getElementById('run');rb.addEventListener('touchstart',function(e){e.preventDefault();sprint=true},{passive:false});rb.addEventListener('touchend',function(){sprint=false});rb.addEventListener('touchcancel',function(){sprint=false});document.getElementById('play').onclick=function(){document.getElementById('start').style.display='none';try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(_){}reset()};document.getElementById('retry').onclick=reset;
