<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>検索履歴に、明日がある</title><style>
*{box-sizing:border-box}body{margin:0;background:#050607;color:#d8ddd9;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}.desktop{height:100dvh;background:radial-gradient(circle at 55% 35%,#18201d,#030404 70%);position:relative}.top{height:32px;background:#101412dd;border-bottom:1px solid #28302d;display:flex;align-items:center;padding:0 12px;font-size:12px}.clock{margin-left:auto}.icons{padding:22px;display:grid;gap:18px;width:120px}.icon{width:86px;text-align:center;font-size:12px;cursor:pointer;touch-action:manipulation}.icon b{display:block;font-size:28px}.window{position:absolute;left:15%;top:8%;width:70%;height:78%;background:#101412;border:1px solid #35403b;box-shadow:0 20px 80px #000;display:none}.bar{height:34px;background:#1a211e;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #35403b}.close{margin-left:auto;padding:8px;cursor:pointer}.content{height:calc(100% - 34px);padding:18px;overflow:auto}h1{font-size:18px}h2{font-size:14px;color:#98aaa1}.search{display:flex;gap:8px}.search input{min-width:0;flex:1;background:#080a09;border:1px solid #35403b;color:#e8ecea;padding:12px;font:inherit}.search button,.btn{background:#202a26;border:1px solid #435049;color:#dfe7e3;padding:10px;font:inherit}.row,.mail,.file{padding:11px 8px;border-bottom:1px solid #252d29;font-size:13px}.future{color:#d2b8b8}.dim{color:#75817b}.popup{position:absolute;width:390px;max-width:92%;background:#111614;border:1px solid #65746c;box-shadow:0 15px 70px #000;padding:18px;display:none;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%)}.glitch{animation:g .12s infinite}@keyframes g{33%{transform:translate(2px,-1px)}66%{transform:translate(-2px,1px)}}.black{position:absolute;inset:0;background:#000;display:none;z-index:30;align-items:center;justify-content:center;text-align:center;padding:30px}.big{font-size:28px;letter-spacing:.1em}#status{position:absolute;bottom:10px;right:14px;font-size:11px;color:#63706a}.redbg{background:#180606!important}@media(max-width:700px){.top{padding-top:env(safe-area-inset-top);height:calc(32px + env(safe-area-inset-top))}.icons{padding:14px;grid-template-columns:repeat(4,1fr);width:100%;gap:6px}.icon{width:auto}.icon b{font-size:24px}.window{left:2%;top:12%;width:96%;height:76%}.content{padding:12px}}
</style></head><body><div class="desktop" id="desk"><div class="top">HOME-PC / user<div class="clock" id="clock">01:48</div></div><div class="icons"><div class="icon" data-open="browser"><b>◉</b>Browser</div><div class="icon" data-open="mail"><b>✉</b>Mail</div><div class="icon" data-open="files"><b>▣</b>Files</div><div class="icon" data-open="memo"><b>▤</b>Memo</div></div><div id="status">接続済み</div>
<div class="window" id="browser"><div class="bar">Browser<span class="close">×</span></div><div class="content"><h1>検索</h1><div class="search"><input id="q" placeholder="検索"><button id="go">検索</button></div><h2>履歴</h2><div id="history"></div><div id="result"></div></div></div>
<div class="window" id="mail"><div class="bar">Mail<span class="close">×</span></div><div class="content"><h1>受信箱</h1><div class="mail" data-mail="1">大家　22:04　Re: 上の階の音について</div><div class="mail" data-mail="2">自分　--:--　下書き（1）</div><div id="mailbody"></div></div></div>
<div class="window" id="files"><div class="bar">Files<span class="close">×</span></div><div class="content"><h1>最近使ったファイル</h1><div class="file" data-file="photo">IMG_2041.jpg</div><div class="file" data-file="log">camera_log.txt</div><div class="file dim" id="hidden">.tomorrow</div><div id="filebody"></div></div></div>
<div class="window" id="memo"><div class="bar">Memo<span class="close">×</span></div><div class="content"><h1>メモ</h1><p>玄関のチェーンを直す。</p><p>上の階の足音について大家にもう一度連絡。</p><p class="dim">※この部屋に上の階はない。</p></div></div>
<div class="popup" id="pop"><h3 id="pt"></h3><div id="pb"></div><button class="btn" id="pok">閉じる</button></div><div class="black" id="black"><div><div class="big" id="ending"></div><p id="endtext"></p><button class="btn" onclick="location.reload()">最初から</button></div></div></div>
<script>
const S={stage:0,searches:0};const future=[['02:13','窓の外　女'],['02:17','玄関　開けない'],['02:24','後ろを見るな'],['02:31','死体　処分方法'],['02:46','検索履歴　消す方法'],['02:51','未来を変える方法'],['03:02','俺を殺す方法'],['03:14','検索履歴に、明日がある']];let mins=108;const $=s=>document.querySelector(s);function fmt(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function tick(n=1){mins+=n;$('#clock').textContent=fmt(mins);advance()}function render(){$('#history').innerHTML='<div class="row dim">昨日　天気</div><div class="row dim">昨日　眠れない　対処</div>'+future.map((x,i)=>'<div class="row '+(i<=S.stage?'future':'dim')+'">'+x[0]+'　'+(i<=S.stage?x[1]:'[読み込み中...]')+'</div>').join('')}function openWin(id){document.querySelectorAll('.window').forEach(x=>x.style.display='none');$('#'+id).style.display='block';tick()}document.querySelectorAll('.icon').forEach(x=>x.onclick=()=>openWin(x.dataset.open));document.querySelectorAll('.close').forEach(x=>x.onclick=()=>x.closest('.window').style.display='none');function popup(t,b){$('#pt').textContent=t;$('#pb').innerHTML=b;$('#pop').style.display='block'}$('#pok').onclick=()=>$('#pop').style.display='none';
document.querySelectorAll('.mail').forEach(x=>x.onclick=()=>{tick();if(x.dataset.mail==='1')$('#mailbody').innerHTML='<p><b>大家:</b></p><p>確認しましたが、あなたの部屋は最上階です。屋上設備の点検も異常ありません。</p><p>昨夜の共用廊下カメラを確認しました。午前2時ごろ、あなたが玄関前に立っていました。</p><p>外からではなく、<b>部屋の中を向いて。</b></p>';else{$('#mailbody').innerHTML='<p><b>下書き / 送信先なし</b></p><p>見つけた。</p><p>検索履歴は予告じゃない。</p><p>これは、前の俺が残した順番だ。</p>';S.stage=Math.max(S.stage,3);render()}});
document.querySelectorAll('.file').forEach(x=>x.onclick=()=>{tick();if(x.dataset.file==='photo')$('#filebody').innerHTML='<h2>IMG_2041.jpg</h2><div style="height:240px;background:#070808;display:flex;align-items:center;justify-content:center;border:1px solid #333;font-size:70px">▯</div><p class="dim">撮影日時: 明日 02:13</p>';if(x.dataset.file==='log'){$('#filebody').innerHTML='<pre>01:03 motion: none\n01:47 motion: DESK\n02:13 motion: WINDOW\n02:17 motion: DOOR\n02:24 motion: BEHIND_USER</pre>';S.stage=Math.max(S.stage,2);render()}if(x.id==='hidden'){$('#filebody').innerHTML='<pre>LOOP=6\nRULE: DO NOT FOLLOW ALL SEARCHES\nRULE: ONE SEARCH MUST REMAIN UNDONE\nEXIT QUERY = 検索履歴に、明日がある</pre>';S.stage=7;render();popup('ファイルが変更されました','<p>変更者: <b>user</b></p><p>変更日時: 03:16</p>')}});
function search(){let v=$('#q').value.trim();if(!v)return;tick(2);S.searches++;$('#result').innerHTML='<h2>検索結果</h2><p>「'+v+'」に一致する結果はありません。</p>';if(v.includes('未来')||v.includes('検索履歴')){S.stage=Math.max(S.stage,4);render()}if(v==='検索履歴に、明日がある')end();if(S.searches===3)popup('Browser','<p>この検索を続けますか？</p><p class="dim">候補: <b>後ろを見る</b></p>')}$('#go').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};
function advance(){if(mins>=133&&S.stage<1){S.stage=1;render();popup('音声デバイス','<p>窓側で音を検出しました。</p>')}if(mins>=144&&S.stage<2){S.stage=2;render();$('#desk').classList.add('glitch');setTimeout(()=>$('#desk').classList.remove('glitch'),700)}if(mins>=151&&S.stage<3){S.stage=3;render();$('#status').textContent='不明なデバイスが接続されました'}if(mins>=166&&S.stage<4){S.stage=4;render()}if(mins>=171&&S.stage<5){S.stage=5;render();popup('入力履歴','<p>「未来を変える方法」</p><p>入力時刻: <b>明日 02:51</b></p>')}if(mins>=182&&S.stage<6){S.stage=6;render();$('#desk').classList.add('redbg')}if(mins>=194&&S.stage<7){S.stage=7;render();popup('Browser','<p>最後の履歴だけが実行されていません。</p>')}}function end(){$('#black').style.display='flex';$('#ending').textContent='03:15';$('#endtext').innerHTML='検索結果はありません。<br><br>履歴から「03:14　検索履歴に、明日がある」が消えた。<br><br>代わりに一件だけ追加された。<br><br><b>明日　--:--　おはよう</b>'}setInterval(()=>{if(document.visibilityState==='visible'&&mins<195)tick()},12000);render();setTimeout(()=>popup('復元されたタブ','<p>前回、Browserは正常に終了しませんでした。</p><p>セッションを復元しました。</p>'),900);
</script></body></html>
