<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ESCAPE TEST</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ddd;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0;background:#d9d9d9}canvas{width:100%;height:100%;display:block}#start,#over{position:fixed;inset:0;z-index:20;background:#f4f4f4;color:#111;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}#over{display:none;background:#111;color:#fff}.title{font-size:34px;font-weight:900}.sub{line-height:1.8}button{font-size:18px;padding:16px 38px;border:2px solid #111;background:#fff;color:#111;border-radius:8px}#ui{position:fixed;inset:0;pointer-events:none}#stick{position:absolute;left:20px;bottom:25px;width:120px;height:120px;border:3px solid #333;border-radius:50%;background:#ffffff88}#nub{position:absolute;left:37px;top:37px;width:40px;height:40px;border-radius:50%;background:#222}#run{pointer-events:auto;position:absolute;right:24px;bottom:42px;width:86px;height:60px;border:2px solid #222;border-radius:12px;background:#fff;color:#111;display:grid;place-items:center;font-weight:800}#objective{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 14px;border:2px solid #222;color:#111;font-weight:700;white-space:nowrap}</style></head><body><div id="game"><canvas id="c"></canvas></div><div id="ui"><div id="objective">緑の出口まで逃げろ</div><div id="stick"><div id="nub"></div></div><div id="run">RUN</div></div><div id="start"><div><div class="title">ESCAPE TEST</div><p class="sub">赤い敵から逃げて、緑の出口へ。<br>左下をドラッグして移動。</p><button id="play">START</button></div></div><div id="over"><div><div class="title" id="result"></div><p id="result2"></p><button id="retry">RETRY</button></div></div><script>
var c=document.getElementById('c'),x=c.getContext('2d'),W=0,H=0,dpr=1,p={x:.15,y:.5},e={x:.82,y:.5},mv={x:0,y:0},playing=false,fast=false,last=0;function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',size);
var walls=[{x:.28,y:0,w:.05,h:.62},{x:.5,y:.38,w:.05,h:.62},{x:.72,y:0,w:.05,h:.62}];function hit(nx,ny){var r=.025;for(var i=0;i<walls.length;i++){var a=walls[i];if(nx+r>a.x&&nx-r<a.x+a.w&&ny+r>a.y&&ny-r<a.y+a.h)return true}return nx<.04||nx>.96||ny<.08||ny>.92}function reset(){p={x:.15,y:.5};e={x:.82,y:.5};playing=true;document.getElementById('over').style.display='none';last=performance.now()}function end(win){playing=false;document.getElementById('over').style.display='flex';document.getElementById('result').textContent=win?'ESCAPED':'CAUGHT';document.getElementById('result2').textContent=win?'逃げ切った。':'捕まった。'}
function update(dt){if(!playing)return;var l=Math.hypot(mv.x,mv.y)||1,sp=(fast?.34:.22)*dt,nx=p.x+mv.x/l*sp,ny=p.y+mv.y/l*sp;if(!hit(nx,p.y))p.x=nx;if(!hit(p.x,ny))p.y=ny;var dx=p.x-e.x,dy=p.y-e.y,dl=Math.hypot(dx,dy)||1,es=.13*dt,ex=e.x+dx/dl*es,ey=e.y+dy/dl*es;if(!hit(ex,e.y))e.x=ex;if(!hit(e.x,ey))e.y=ey;if(Math.hypot(p.x-e.x,p.y-e.y)<.055)end(false);if(p.x>.9&&p.y<.2)end(true)}
function draw(){x.fillStyle='#d9d9d9';x.fillRect(0,0,W,H);x.fillStyle='#444';for(var i=0;i<walls.length;i++){var a=walls[i];x.fillRect(a.x*W,a.y*H,a.w*W,a.h*H)}x.fillStyle='#18a34a';x.fillRect(.88*W,.08*H,.08*W,.12*H);x.fillStyle='#1677ff';x.beginPath();x.arc(p.x*W,p.y*H,Math.max(12,W*.025),0,7);x.fill();x.fillStyle='#d11';x.beginPath();x.arc(e.x*W,e.y*H,Math.max(14,W*.03),0,7);x.fill()}
function loop(t){var dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
var sid=null,st=null,n=document.getElementById('nub');c.addEventListener('touchstart',function(ev){ev.preventDefault();var t=ev.changedTouches[0];if(t.clientX<innerWidth*.6){sid=t.identifier;st={x:t.clientX,y:t.clientY}}},{passive:false});c.addEventListener('touchmove',function(ev){ev.preventDefault();for(var i=0;i<ev.changedTouches.length;i++){var t=ev.changedTouches[i];if(t.identifier===sid){var dx=t.clientX-st.x,dy=t.clientY-st.y,m=Math.hypot(dx,dy),lim=42;if(m>lim){dx*=lim/m;dy*=lim/m}mv={x:dx,y:dy};n.style.transform='translate('+dx+'px,'+dy+'px)'}}},{passive:false});c.addEventListener('touchend',function(){sid=null;mv={x:0,y:0};n.style.transform='none'});var run=document.getElementById('run');run.addEventListener('touchstart',function(ev){ev.preventDefault();fast=true},{passive:false});run.addEventListener('touchend',function(){fast=false});document.getElementById('play').onclick=function(){document.getElementById('start').style.display='none';reset()};document.getElementById('retry').onclick=reset;
</script></body></html>
