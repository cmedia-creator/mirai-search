  interactEl.textContent='TAP / E  調べる';
  interactEl.style.opacity='.82';
 }else{
  interactEl.style.opacity='0';
 }
}
function interact(){
 if(!running||!currentInteractable||interactCooldown>0)return;
 interactCooldown=.25;
 const id=currentInteractable.id;
 behaviorLogger.recordInteraction(id);
 if(id==='EXIT_DOOR'&&gameState.realExit){statusEl.textContent='朝の光が差している。';setTimeout(completeDream01,900);return}
 if(id==='EXIT_DOOR'&&gameState.exitUnlocked){statusEl.textContent='扉の向こうは暗い。';setTimeout(falseExit,650);return}
 statusEl.textContent=id==='GIRL_DESK'?(anomalyVisual.desk?'傷が増えている。':'名前の部分だけ削れている。'):
  id==='LOCKER'?(anomalyVisual.locker?'中に、長い髪が一本落ちている。':'古いロッカーだ。'):
  id==='WINDOW'?(anomalyVisual.window?'校庭に、誰もいない。':'曇った窓だ。'):
  id==='BLACKBOARD'?(anomalyVisual.blackboard?'消した跡がある。「まだ？」':'何も書かれていない。'):
  id==='EXIT_DOOR'?'開かない。':'調べた。';
 setTimeout(()=>{if(running)statusEl.textContent='DREAM 01 PLAYABLE TEST'},1600);
}
cv.addEventListener('click',()=>interact());
window.addEventListener('keydown',e=>{if(e.code==='KeyE'||e.code==='Space'){e.preventDefault();interact()}});
function getAreaId(x,z){
 if(z<-13)return 'FRONT';
 if(z<-9)return x>3.8?'LOCKERS':'BACK_ROWS';
 if(z<-5)return x>3.8?'LOCKERS':'MID_ROWS';
 return x<-3.8?'WINDOW_SIDE':'ENTRANCE';
}
function update(dt){
 if(!running)return;
 let len=Math.hypot(mv.x,mv.y);
 if(len>1){mv.x/=len;mv.y/=len;len=1}
 const isMoving=len>.08;
 behaviorLogger.update(dt,isMoving,isMoving&&sprint,getAreaId(pos.x,pos.z));
 updateDreamState(dt);
 if(interactCooldown>0)interactCooldown=Math.max(0,interactCooldown-dt);
 refreshInteraction();
 let sp=(sprint?2.3:1.4)*dt,fx=Math.cos(yaw),fz=Math.sin(yaw),rx=-fz,rz=fx,
     nx=pos.x+(fx*(-mv.y)+rx*mv.x)*sp,nz=pos.z+(fz*(-mv.y)+rz*mv.x)*sp;
 if(!blocked(nx,pos.z))pos.x=nx;
 if(!blocked(pos.x,nz))pos.z=nz;
}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
let lid=null,rid=null,ls=null,rs=null,nub=document.getElementById('nub');cv.addEventListener('touchstart',e=>{e.preventDefault();for(let t of e.changedTouches){if(t.clientX<innerWidth*.5&&lid===null){lid=t.identifier;ls={x:t.clientX,y:t.clientY}}else if(rid===null){rid=t.identifier;rs={x:t.clientX,y:t.clientY}}}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches){if(t.identifier===lid){let dx=t.clientX-ls.x,dy=t.clientY-ls.y,m=Math.hypot(dx,dy),lim=38;if(m>lim){dx*=lim/m;dy*=lim/m}mv.x=dx/lim;mv.y=dy/lim;nub.style.transform='translate('+dx+'px,'+dy+'px)'}else if(t.identifier===rid){yaw+=(t.clientX-rs.x)*.006;rs.x=t.clientX;rs.y=t.clientY}}},{passive:false});
function endTouch(e){for(let t of e.changedTouches){if(t.identifier===lid){lid=null;mv.x=mv.y=0;nub.style.transform='none'}if(t.identifier===rid)rid=null}}cv.addEventListener('touchend',endTouch);cv.addEventListener('touchcancel',endTouch);
let rb=document.getElementById('run');rb.addEventListener('touchstart',e=>{e.preventDefault();sprint=true},{passive:false});rb.addEventListener('touchend',()=>sprint=false);rb.addEventListener('touchcancel',()=>sprint=false);
}catch(err){startEl.style.display='none';statusEl.textContent='起動失敗: '+String(err).slice(0,120);console.error(err);}
})();
</script></body></html>
