<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ESCAPE TEST</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;color:#fff}#goal{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.16em;text-shadow:0 2px 5px #000}#run{position:absolute;right:22px;bottom:max(24px,env(safe-area-inset-bottom));width:76px;height:76px;border:1px solid #ffffff66;border-radius:50%;display:grid;place-items:center;background:#ffffff12;font-weight:700;pointer-events:auto}#stick{position:absolute;left:22px;bottom:max(24px,env(safe-area-inset-bottom));width:116px;height:116px;border:1px solid #ffffff38;border-radius:50%;background:#ffffff0a}#nub{position:absolute;width:46px;height:46px;border-radius:50%;background:#ffffff55;left:35px;top:35px}#msg,#start{position:fixed;inset:0;background:#000d;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;z-index:5;padding:30px}#start{display:flex;background:#050505}button{font:inherit;color:#fff;background:#111;border:1px solid #777;padding:14px 28px;margin-top:20px;min-width:180px}.big{font-size:30px;font-weight:800;letter-spacing:.12em}.small{font-size:13px;color:#aaa;line-height:1.8}.danger{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 100px rgba(150,0,0,0);transition:.1s}
</style></head><body><canvas id="c"></canvas><div class="danger" id="danger"></div><div id="hud"><div id="goal">非常口まで逃げろ</div><div id="stick"><div id="nub"></div></div><div id="run">RUN</div></div><div id="start"><div><div class="big">ESCAPE</div><p class="small">左側をドラッグ：移動<br>右側をドラッグ：視点<br>RUN：走る<br><br>PC：WASD / 矢印キー</p><button id="play">START</button></div></div><div id="msg"><div><div class="big" id="msgTitle"></div><p class="small" id="msgText"></p><button id="retry">RETRY</button></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;X.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const map=["111111111111111","100000000000001","101111011111101","100001010000001","111101010111101","100001010100001","101111010101111","100000010100001","101111110111101","100000000000001","111111111111111"];const MW=15,MH=11;
let p,e,ang,keys={},running=false,runHeld=false,last=0,move={x:0,y:0};function reset(){p={x:1.5,y:1.5};e={x:13.2,y:9.2};ang=0;running=true;last=performance.now();document.getElementById('msg').style.display='none'}function wall(x,y){let ix=Math.floor(x),iy=Math.floor(y);return ix<0||iy<0||ix>=MW||iy>=MH||map[iy][ix]=='1'}function can(x,y){return !wall(x-.18,y-.18)&&!wall(x+.18,y-.18)&&!wall(x-.18,y+.18)&&!wall(x+.18,y+.18)}
function cast(a){let dx=Math.cos(a),dy=Math.sin(a),d=0;while(d<20){d+=.035;if(wall(p.x+dx*d,p.y+dy*d))return d}return 20}
function update(dt){if(!running)return;let f=(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0)+(-move.y);let s=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+(move.x);let len=Math.hypot(f,s);if(len>1){f/=len;s/=len}let speed=(runHeld?2.8:1.7)*dt;let nx=p.x+(Math.cos(ang)*f+Math.cos(ang+Math.PI/2)*s)*speed,ny=p.y+(Math.sin(ang)*f+Math.sin(ang+Math.PI/2)*s)*speed;if(can(nx,p.y))p.x=nx;if(can(p.x,ny))p.y=ny;
let dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy),es=(dist<7?1.28:.72)*dt;if(dist>0){let ex=e.x+dx/dist*es,ey=e.y+dy/dist*es;if(can(ex,e.y))e.x=ex;if(can(e.x,ey))e.y=ey}document.getElementById('danger').style.boxShadow='inset 0 0 110px rgba(160,0,0,'+Math.max(0,Math.min(.65,(3.5-dist)/3.5))+')';if(dist<.48)finish(false);if(p.x>12.5&&p.y<1.8)finish(true)}
function finish(win){running=false;document.getElementById('msg').style.display='flex';document.getElementById('msgTitle').textContent=win?'ESCAPED':'CAUGHT';document.getElementById('msgText').textContent=win?'逃げ切った。':'捕まった。'}
function render(){X.fillStyle='#050607';X.fillRect(0,0,W,H);let rays=Math.ceil(W/3),fov=Math.PI/2.8;for(let i=0;i<rays;i++){let ra=ang-fov/2+fov*i/(rays-1),d=cast(ra)*Math.cos(ra-ang),hh=Math.min(H,H/(d*.72)),shade=Math.max(18,150-d*17);X.fillStyle='rgb('+shade+','+shade+','+(shade+3)+')';X.fillRect(i*W/rays,(H-hh)/2,W/rays+1,hh)}let ea=Math.atan2(e.y-p.y,e.x-p.x),rel=Math.atan2(Math.sin(ea-ang),Math.cos(ea-ang)),ed=Math.hypot(e.x-p.x,e.y-p.y);if(Math.abs(rel)<fov*.55&&ed<cast(ea)+.15){let sx=W/2+(rel/(fov/2))*W/2,sz=Math.min(H*.9,H/(ed*.58));X.fillStyle='#080808';X.beginPath();X.ellipse(sx,H/2+sz*.05,sz*.18,sz*.46,0,0,Math.PI*2);X.fill();X.fillStyle='#ddd';X.fillRect(sx-sz*.055,H/2-sz*.15,sz*.035,sz*.018);X.fillRect(sx+sz*.02,H/2-sz*.15,sz*.035,sz*.018)}X.fillStyle='#9b1515';X.font='bold 18px system-ui';let gd=Math.hypot(13.2-p.x,1.5-p.y);X.fillText('EXIT '+gd.toFixed(1)+'m',18,35)}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',ev=>{keys[ev.key]=true});addEventListener('keyup',ev=>{keys[ev.key]=false});let leftId=null,rightId=null,ls=null,rs=null;const nub=document.getElementById('nub'),stick=document.getElementById('stick');function tstart(ev){for(const t of ev.changedTouches){if(t.clientX<W*.5&&leftId===null){leftId=t.identifier;ls={x:t.clientX,y:t.clientY}}else if(rightId===null){rightId=t.identifier;rs={x:t.clientX,y:t.clientY}}}}function tmove(ev){ev.preventDefault();for(const t of ev.changedTouches){if(t.identifier===leftId){let dx=t.clientX-ls.x,dy=t.clientY-ls.y,m=Math.hypot(dx,dy),lim=42;if(m>lim){dx*=lim/m;dy*=lim/m}move={x:dx/lim,y:dy/lim};nub.style.transform='translate('+dx+'px,'+dy+'px)'}else if(t.identifier===rightId){let dx=t.clientX-rs.x;ang+=dx*.006;rs={x:t.clientX,y:t.clientY}}}}function tend(ev){for(const t of ev.changedTouches){if(t.identifier===leftId){leftId=null;move={x:0,y:0};nub.style.transform='none'}if(t.identifier===rightId)rightId=null}}C.addEventListener('touchstart',tstart,{passive:false});C.addEventListener('touchmove',tmove,{passive:false});C.addEventListener('touchend',tend);const rb=document.getElementById('run');rb.addEventListener('touchstart',e=>{e.preventDefault();runHeld=true},{passive:false});rb.addEventListener('touchend',()=>runHeld=false);rb.onmousedown=()=>runHeld=true;addEventListener('mouseup',()=>runHeld=false);document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';reset()};document.getElementById('retry').onclick=reset;
</script></body></html>
