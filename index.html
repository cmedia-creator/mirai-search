*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:monospace}#wrap{position:fixed;inset:0;background:#000}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#scan{position:fixed;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0,rgba(0,0,0,.09) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}.grain{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}#hud{position:fixed;inset:0;z-index:8;pointer-events:none;color:#ddd;text-shadow:2px 2px #000}#objective{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;font-size:12px;letter-spacing:.1em}#stamina{position:absolute;top:32px;left:12px;width:110px;height:7px;border:1px solid #aaa;background:#111}#stam{height:100%;width:100%;background:#bbb}#stick{position:absolute;left:18px;bottom:max(20px,env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #9996;border-radius:50%;background:#1117}#nub{position:absolute;left:36px;top:36px;width:38px;height:38px;border:2px solid #bbb8;border-radius:50%;background:#7778}#run{pointer-events:auto;position:absolute;right:20px;bottom:max(38px,env(safe-area-inset-bottom));width:78px;height:58px;border:2px solid #aaa8;background:#111b;color:#ddd;display:grid;place-items:center;font-weight:bold}#start,#over{position:fixed;inset:0;z-index:30;background:#050505;color:#ccc;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}#over{display:none}.title{font-size:29px;letter-spacing:.18em;font-weight:bold}.sub{font-size:12px;line-height:1.9;color:#888}button{font:inherit;font-size:16px;padding:13px 32px;color:#ccc;background:#090909;border:1px solid #777;min-width:170px}.red{color:#8e2525}</style></head><body><div id="wrap"><canvas id="c" width="320" height="180"></canvas></div><div id="scan"></div><div class="grain"></div><div id="hud"><div id="objective">EXITを探せ</div><div id="stamina"><div id="stam"></div></div><div id="stick"><div id="nub"></div></div><div id="run">RUN</div></div><div id="start"><div><div class="title">ESCAPE</div><p class="sub">左：移動　右画面：視点<br>RUN：走る<br><span class="red">見つかったら逃げろ。</span></p><button id="play">START</button></div></div><div id="over"><div><div class="title" id="result"></div><p class="sub" id="result2"></p><button id="retry">RETRY</button></div></div><script>
var c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;var map=["11111111111111111","10000000000000001","10111101111101101","10000101000101001","11110101010101011","10000100010100001","10111111010111101","10000001010000101","10111001011110101","10001000000010101","10101111111010101","10000000000000001","11111111111111111"],MW=17,MH=13;
var p,e,a,playing=false,fast=false,stamina=1,mv={x:0,y:0},last=0,keys={};function wall(x,y){var ix=Math.floor(x),iy=Math.floor(y);return ix<0||iy<0||ix>=MW||iy>=MH||map[iy][ix]=="1"}function clearAt(x,y){return !wall(x-.16,y-.16)&&!wall(x+.16,y-.16)&&!wall(x-.16,y+.16)&&!wall(x+.16,y+.16)}function reset(){p={x:1.5,y:1.5};e={x:15.2,y:11.2};a=.05;stamina=1;playing=true;document.getElementById("over").style.display="none";last=performance.now()}function cast(ra){var cs=Math.cos(ra),sn=Math.sin(ra),d=.02;while(d<18){if(wall(p.x+cs*d,p.y+sn*d))return d;d+=.035}return 18}function los(){var dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),n=Math.ceil(d/.12);for(var i=1;i<n;i++)if(wall(e.x+dx*i/n,e.y+dy*i/n))return false;return true}

function render(){var W=320,H=180;g.fillStyle="#667078";g.fillRect(0,0,W,H/2);g.fillStyle="#3b3732";g.fillRect(0,H/2,W,H/2);var rays=160,fov=1.05;for(var i=0;i<rays;i++){var ra=a-fov/2+fov*i/(rays-1),d=cast(ra)*Math.cos(ra-a),hh=Math.min(H*1.5,H/(d*.58)),shade=Math.max(48,Math.floor(190-d*14));if(((Math.floor((p.x+Math.cos(ra)*d)*2)+Math.floor((p.y+Math.sin(ra)*d)*2))&1)==0)shade-=8;g.fillStyle="rgb("+shade+","+Math.max(35,shade-10)+","+Math.max(30,shade-16)+")";g.fillRect(i*2,(H-hh)/2,2,hh)}var ea=Math.atan2(e.y-p.y,e.x-p.x),rel=Math.atan2(Math.sin(ea-a),Math.cos(ea-a)),ed=Math.hypot(e.x-p.x,e.y-p.y);if(Math.abs(rel)<fov*.6&&ed<cast(ea)+.18){var sx=W/2+(rel/(fov/2))*W/2,sz=Math.min(150,95/Math.max(.5,ed));g.fillStyle="#060606";g.fillRect(sx-sz*.13,H/2-sz*.37,sz*.26,sz*.72);g.fillStyle="#111";g.fillRect(sx-sz*.2,H/2-sz*.15,sz*.12,sz*.5);g.fillRect(sx+sz*.08,H/2-sz*.15,sz*.12,sz*.5);g.fillStyle="#b7b7a5";g.fillRect(sx-sz*.055,H/2-sz*.25,sz*.035,Math.max(1,sz*.018));g.fillRect(sx+sz*.02,H/2-sz*.25,sz*.035,Math.max(1,sz*.018))}g.fillStyle="#ddd";g.fillRect(159,89,3,1);g.fillRect(160,88,1,3);var exitA=Math.atan2(1.5-p.y,15.5-p.x),er=Math.atan2(Math.sin(exitA-a),Math.cos(exitA-a)),exitD=Math.hypot(15.5-p.x,1.5-p.y);if(Math.abs(er)<fov*.5&&exitD<cast(exitA)+.2){var exs=W/2+(er/(fov/2))*W/2;g.fillStyle="#365b3b";g.fillRect(exs-10,H/2-28,20,56);g.fillStyle="#b6c7a9";g.font="6px monospace";g.fillText("EXIT",exs-8,H/2-18)}}
function end(win){playing=false;document.getElementById("over").style.display="flex";document.getElementById("result").textContent=win?"ESCAPED":"CAUGHT";document.getElementById("result2").textContent=win?"外へ出た。":"捕まった。"}function loop(t){var dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener("keydown",function(ev){keys[ev.key]=true});addEventListener("keyup",function(ev){keys[ev.key]=false});var lid=null,rid=null,ls=null,rs=null,nub=document.getElementById("nub");c.addEventListener("touchstart",function(ev){ev.preventDefault();for(var i=0;i<ev.changedTouches.length;i++){var t=ev.changedTouches[i];if(t.clientX<innerWidth*.5&&lid===null){lid=t.identifier;ls={x:t.clientX,y:t.clientY}}else if(rid===null){rid=t.identifier;rs={x:t.clientX,y:t.clientY}}}},{passive:false});c.addEventListener("touchmove",function(ev){ev.preventDefault();for(var i=0;i<ev.changedTouches.length;i++){var t=ev.changedTouches[i];if(t.identifier===lid){var dx=t.clientX-ls.x,dy=t.clientY-ls.y,m=Math.hypot(dx,dy),lim=38;if(m>lim){dx*=lim/m;dy*=lim/m}mv={x:dx/lim,y:dy/lim};nub.style.transform="translate("+dx+"px,"+dy+"px)"}else if(t.identifier===rid){a+=(t.clientX-rs.x)*.007;rs={x:t.clientX,y:t.clientY}}}},{passive:false});function tend(ev){for(var i=0;i<ev.changedTouches.length;i++){var t=ev.changedTouches[i];if(t.identifier===lid){lid=null;mv={x:0,y:0};nub.style.transform="none"}if(t.identifier===rid)rid=null}}c.addEventListener("touchend",tend);c.addEventListener("touchcancel",tend);var rb=document.getElementById("run");rb.addEventListener("touchstart",function(ev){ev.preventDefault();fast=true},{passive:false});rb.addEventListener("touchend",function(){fast=false});rb.addEventListener("touchcancel",function(){fast=false});document.getElementById("play").onclick=function(){document.getElementById("start").style.display="none";reset()};document.getElementById("retry").onclick=reset;
